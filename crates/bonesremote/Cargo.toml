[package]
name = "bonesremote"
version = "1.0.3"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"


[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.4"
flate2 = "1.1.5"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = "0.4.44"
time = { version = "0.3.51", features = ["formatting", "macros"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
bonesdeploy-core = { version = "1.0.3", path = "../bonesdeploy-core" }
borgbackup = "0.10"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
