[package]
name = "bonesremote"
version = "0.8.6"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"


[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.4"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8.23"
time = { version = "0.3.51", features = ["formatting", "macros"] }
bonesdeploy-core = { version = "0.8.6", path = "../bonesdeploy-core" }

[lints]
workspace = true
