[package]
name = "bonesinfra"
version = "0.6.2"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"

[dependencies]
anyhow = "1.0.103"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
bonesdeploy-core = { version = "1.1.3", path = "../bonesdeploy-core" }
tempfile = "3.27.0"
sha2 = "0.10.9"
rustinfra = "0.2.0"
crc32fast = "1.5.0"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shlex = "2.0.1"
toml = "1.1.3"

[dev-dependencies]
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
