[package]
name = "bonesinfra"
version = "0.3.4"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"

[features]
wheel-builder = []

[[bin]]
name = "build-wheel"
path = "src/bin/build-wheel.rs"
required-features = ["wheel-builder"]

[dependencies]
anyhow = "1.0.103"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
bonesdeploy-core = { version = "0.8.7", path = "../bonesdeploy-core" }
tempfile = "3.27.0"
sha2 = "0.10.9"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[build-dependencies]
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
anyhow = "1.0.103"

[lints]
workspace = true
