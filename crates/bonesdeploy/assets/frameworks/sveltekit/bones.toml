[framework]
template = "sveltekit"
web_root = "build"
node_version = "24.18.0"

[framework.permissions]
paths = [
  { path = "*", type = "dir", mode = "750" },
  { path = "*", type = "file", mode = "640" },
  { path = "build", type = "dir", mode = "770", recursive = true },
]

[framework.shared]
paths = [
  { path = ".env", type = "file" },
]
