[package]
name = "bonesdeploy"
version = "1.0.7"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.4"
flate2 = "1.1.5"
inquire = "0.9.4"
libc = "0.2.186"
openssh = { version = "0.11.6", features = ["native-mux"] }
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = "0.4.44"
toml = "1.1.3"
tempfile = "3.27"
time = { version = "0.3.51", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "process", "rt", "rt-multi-thread", "macros", "sync", "time"] }
bonesdeploy-core = { version = "1.0.7", path = "../bonesdeploy-core" }
bonesinfra = { version = "0.5.6", path = "../bonesinfra" }
getrandom = "0.4.3"

[lints]
workspace = true
