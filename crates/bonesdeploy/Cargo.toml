[package]
name = "bonesdeploy"
version = "0.8.6"
edition = "2024"
authors=["Alex Younger <thealexyounger@proton.me>"]
description="Deployments with a Spine in a Barebones Framework"
license="Apache-2.0"
repository="https://github.com/AlextheYounga/bonesdeploy"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.4"
inquire = "0.9.4"
openssh = { version = "0.11.6", features = ["native-mux"] }
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"
toml_edit = "0.22"
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
bonesdeploy-core = { version = "0.8.6", path = "../bonesdeploy-core" }
bonesinfra = { version = "0.3.3", path = "../bonesinfra" }
easy-tree = "0.4.0"

[lints]
workspace = true
