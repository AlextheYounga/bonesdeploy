name: Windows Docker Desktop smoke

on:
  workflow_dispatch:

concurrency:
  group: windows-docker-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, windows, docker-desktop]
    env:
      SMOKE_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify required runner capabilities
        shell: pwsh
        run: |
          docker version
          $endpoint = docker context inspect --format '{{.Endpoints.docker.Host}}'
          if ($endpoint -notmatch '^npipe:////\./pipe/') { throw "Docker Desktop did not expose a local named pipe: $endpoint" }
          $osType = docker info --format '{{.OSType}}'
          if ($osType -ne 'linux') { throw "Docker Desktop must run Linux containers, got: $osType" }
          ssh.exe -V
          git --version

      - name: Build Windows local CLI
        shell: pwsh
        run: cargo build --locked --release --package bonesdeploy --target x86_64-pc-windows-msvc

      - name: Exercise Docker Desktop native and Compose builds from a path with spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = (Resolve-Path '.\target\x86_64-pc-windows-msvc\release\bonesdeploy.exe').Path
          $projectName = "docker-smoke-$env:SMOKE_SCOPE"
          $project = Join-Path $env:RUNNER_TEMP "BonesDeploy Docker Smoke $env:SMOKE_SCOPE"
          $composeImage = "bonesdeploy-smoke-$env:SMOKE_SCOPE"
          Remove-Item -Recurse -Force $project -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $project | Out-Null
          Push-Location $project
          try {
            git init --initial-branch=main
            git config user.email smoke@example.invalid
            git config user.name Smoke
            New-Item -ItemType Directory -Path infra/deployment/build -Force | Out-Null
            Set-Content -NoNewline infra/deployment/build/01_smoke.sh 'printf smoke > smoke-output.txt'
            git add infra
            git commit -m smoke
            & $binary init --non-interactive --project-name $projectName --branch main --host 127.0.0.1 --template none --runtime-backend native
            if ($LASTEXITCODE -ne 0) { throw 'native smoke initialization failed' }
            $nativeOutput = & $binary build
            if ($LASTEXITCODE -ne 0) { throw 'native smoke build failed' }
            if ($nativeOutput -notmatch "Built $projectName") { throw 'native build did not produce an artifact' }
            $nativeBuildPrefix = [regex]::Escape("bonesdeploy-build-$projectName-")
            if (docker ps -a --format '{{.Names}}' | Select-String -Quiet "^$nativeBuildPrefix") { throw 'native build container was not cleaned up' }

            Remove-Item -Recurse -Force infra
            Set-Content -NoNewline Dockerfile 'FROM alpine:3.21'
            Set-Content -NoNewline compose.yaml "services:`n  smoke:`n    build: .`n    image: $composeImage"
            git add --all
            git commit -m compose
            & $binary init --non-interactive --project-name $projectName --branch main --host 127.0.0.1 --template none --runtime-backend docker
            if ($LASTEXITCODE -ne 0) { throw 'Compose smoke initialization failed' }
            & $binary build
            if ($LASTEXITCODE -ne 0) { throw 'Compose smoke build failed' }
            $generatedImages = @(docker image ls -q --filter "reference=bonesdeploy-$projectName-*")
            if ($generatedImages) { throw 'temporary Compose release tags were not cleaned up' }
            docker compose --project-directory $project config --quiet
            if ($LASTEXITCODE -ne 0) { throw 'Compose validation failed' }
            docker compose --project-directory $project build
            if ($LASTEXITCODE -ne 0) { throw 'Compose build failed' }
            docker image rm --force $composeImage 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'Compose image cleanup failed' }
            $remainingComposeImage = @(docker image ls -q --filter "reference=$composeImage")
            if ($LASTEXITCODE -ne 0) { throw 'Compose image verification failed' }
            if ($remainingComposeImage) { throw 'Compose image was not cleaned up' }
            $generatedImages = @(docker image ls -q --filter "reference=bonesdeploy-$projectName-*")
            if ($generatedImages) { throw 'temporary Compose release tags were not cleaned up' }
          }
          finally {
            Pop-Location
            Remove-Item -Recurse -Force $project -ErrorAction SilentlyContinue
          }

      - name: Exercise Windows OpenSSH against an ephemeral Linux sshd container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $container = "bonesdeploy-smoke-sshd-$env:SMOKE_SCOPE"
          $key = Join-Path $env:RUNNER_TEMP "bonesdeploy-smoke-ssh-key-$env:SMOKE_SCOPE"
          Remove-Item $key, "$key.pub" -Force -ErrorAction SilentlyContinue
          ssh-keygen.exe -q -t ed25519 -N '""' -f $key
          $publicKey = Get-Content -Raw "$key.pub"
          docker run --detach --rm --name $container --label "com.bonesdeploy.smoke.run=$env:SMOKE_SCOPE" --publish 127.0.0.1::22 --env "PUBLIC_KEY=$publicKey" alpine:3.21 sh -ec 'apk add --no-cache openssh; adduser -D smoke; install -d -m 700 -o smoke -g smoke /home/smoke/.ssh; printf "%s\n" "$PUBLIC_KEY" > /home/smoke/.ssh/authorized_keys; chown smoke:smoke /home/smoke/.ssh/authorized_keys; chmod 600 /home/smoke/.ssh/authorized_keys; mkdir -p /run/sshd; ssh-keygen -A; exec /usr/sbin/sshd -D -e -o PasswordAuthentication=no -o PermitRootLogin=no' | Out-Null
          try {
            $port = (docker port $container 22/tcp).Split(':')[-1]
            $remoteCommand = 'printf ''%s'' "spaces '' quotes \$dollars; semicolon"'
            $expected = 'spaces '' quotes $dollars; semicolon'
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $sshOutput = & ssh.exe -i $key -p $port -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL smoke@127.0.0.1 $remoteCommand
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($LASTEXITCODE -ne 0) { throw 'ssh.exe could not run the Linux sshd smoke command' }
            if ($sshOutput -ne $expected) { throw "ssh.exe changed shell metacharacters: $sshOutput" }
          }
          finally {
            docker rm --force $container 2>$null
            Remove-Item $key, "$key.pub" -Force -ErrorAction SilentlyContinue
          }

      - name: Clean up smoke resources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $projectName = "docker-smoke-$env:SMOKE_SCOPE"
          $project = Join-Path $env:RUNNER_TEMP "BonesDeploy Docker Smoke $env:SMOKE_SCOPE"
          $composeImage = "bonesdeploy-smoke-$env:SMOKE_SCOPE"
           $key = Join-Path $env:RUNNER_TEMP "bonesdeploy-smoke-ssh-key-$env:SMOKE_SCOPE"
           $label = "com.bonesdeploy.smoke.run=$env:SMOKE_SCOPE"
           $cleanupFailures = [System.Collections.Generic.List[string]]::new()

           function Invoke-CleanupStep {
             param(
               [string]$Name,
               [scriptblock]$Action
             )

             for ($attempt = 1; $attempt -le 3; $attempt++) {
               try {
                 $global:LASTEXITCODE = 0
                 & $Action
                 if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
                 return
               }
               catch {
                 if ($attempt -lt 3) { Start-Sleep -Seconds 1 }
               }
             }

             [void]$cleanupFailures.Add($Name)
           }

           Invoke-CleanupStep 'run-scoped container cleanup' {
             $containers = @(docker ps -aq --filter "label=$label")
             if ($LASTEXITCODE -ne 0) { throw 'container lookup failed' }
             $containers += @(docker ps -aq --filter "name=bonesdeploy-build-$projectName-")
             if ($LASTEXITCODE -ne 0) { throw 'container lookup failed' }
             $containers = $containers | Where-Object { $_ } | Sort-Object -Unique
             if ($containers) { docker rm --force $containers }
           }
           Invoke-CleanupStep 'run-scoped image cleanup' {
             $images = @(docker image ls -q --filter "label=$label")
             if ($LASTEXITCODE -ne 0) { throw 'image lookup failed' }
             $images += @(docker image ls -q --filter "reference=bonesdeploy-$projectName-*")
             if ($LASTEXITCODE -ne 0) { throw 'image lookup failed' }
             $images = $images | Where-Object { $_ } | Sort-Object -Unique
             if ($images) { docker image rm --force $images }
           }
           Invoke-CleanupStep 'Compose image cleanup' {
             $composeImages = @(docker image ls -q --filter "reference=$composeImage")
             if ($LASTEXITCODE -ne 0) { throw 'Compose image lookup failed' }
             if ($composeImages) { docker image rm --force $composeImage 2>$null }
           }
           Invoke-CleanupStep 'project directory cleanup' {
             if (Test-Path -LiteralPath $project) {
               Remove-Item -Recurse -Force $project -ErrorAction Stop
             }
           }
           Invoke-CleanupStep 'SSH key cleanup' {
             $keyFiles = @($key, "$key.pub") | Where-Object { Test-Path -LiteralPath $_ }
             if ($keyFiles) { Remove-Item $keyFiles -Force -ErrorAction Stop }
           }

           Invoke-CleanupStep 'run-scoped container verification' {
             $containers = @(docker ps -aq --filter "label=$label")
             if ($LASTEXITCODE -ne 0) { throw 'container verification failed' }
             $containers += @(docker ps -aq --filter "name=bonesdeploy-build-$projectName-")
             if ($LASTEXITCODE -ne 0) { throw 'container verification failed' }
             $containers = $containers | Where-Object { $_ } | Sort-Object -Unique
             if ($containers) { throw 'run-scoped containers remain' }
           }
           Invoke-CleanupStep 'generated image verification' {
             $generatedImages = @(docker image ls -q --filter "reference=bonesdeploy-$projectName-*")
             if ($LASTEXITCODE -ne 0) { throw 'generated image verification failed' }
             if ($generatedImages) { throw 'generated image references remain' }
           }
           Invoke-CleanupStep 'Compose image verification' {
             $remainingComposeImage = @(docker image ls -q --filter "reference=$composeImage")
             if ($LASTEXITCODE -ne 0) { throw 'Compose image verification failed' }
             if ($remainingComposeImage) { throw 'Compose image remains' }
           }
           Invoke-CleanupStep 'key file verification' {
             if (Test-Path -LiteralPath $key -PathType Leaf) { throw 'private SSH key remains' }
             if (Test-Path -LiteralPath "$key.pub" -PathType Leaf) { throw 'public SSH key remains' }
           }
           Invoke-CleanupStep 'project directory verification' {
             if (Test-Path -LiteralPath $project) { throw 'project directory remains' }
           }

           if ($cleanupFailures.Count -gt 0) {
             throw "Smoke cleanup failed: $($cleanupFailures -join ', ')"
           }
